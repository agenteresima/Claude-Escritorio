<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0f1117" stroke="#00d4aa" stroke-width="3"/>

  <!-- Candlestick chart -->
  <!-- Bar 1 (bearish, red) -->
  <rect x="22" y="52" width="10" height="26" rx="1.5" fill="#ff4757"/>
  <line x1="27" y1="44" x2="27" y2="52" stroke="#ff4757" stroke-width="2.5"/>
  <line x1="27" y1="78" x2="27" y2="86" stroke="#ff4757" stroke-width="2.5"/>

  <!-- Bar 2 (bullish, green) -->
  <rect x="42" y="44" width="10" height="30" rx="1.5" fill="#00d4aa"/>
  <line x1="47" y1="36" x2="47" y2="44" stroke="#00d4aa" stroke-width="2.5"/>
  <line x1="47" y1="74" x2="47" y2="82" stroke="#00d4aa" stroke-width="2.5"/>

  <!-- Bar 3 (bullish, green) -->
  <rect x="62" y="38" width="10" height="28" rx="1.5" fill="#00d4aa"/>
  <line x1="67" y1="28" x2="67" y2="38" stroke="#00d4aa" stroke-width="2.5"/>
  <line x1="67" y1="66" x2="67" y2="76" stroke="#00d4aa" stroke-width="2.5"/>

  <!-- Bar 4 (bearish, red) -->
  <rect x="82" y="46" width="10" height="20" rx="1.5" fill="#ff4757"/>
  <line x1="87" y1="36" x2="87" y2="46" stroke="#ff4757" stroke-width="2.5"/>
  <line x1="87" y1="66" x2="87" y2="74" stroke="#ff4757" stroke-width="2.5"/>

  <!-- Trend arrow (up-right) -->
  <polyline points="20,88 47,68 67,58 100,38" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <polygon points="100,38 92,36 96,44" fill="#ffd700" opacity="0.85"/>

  <!-- Bot/AI sparkle dots -->
  <circle cx="104" cy="84" r="4" fill="#00d4aa" opacity="0.9"/>
  <circle cx="114" cy="76" r="2.5" fill="#00d4aa" opacity="0.6"/>
  <circle cx="110" cy="92" r="2" fill="#00d4aa" opacity="0.4"/>
</svg>
