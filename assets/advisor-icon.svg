<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo degradado oscuro -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="#00e5c0" stroke-width="2.5"/>

  <!-- Cerebro / chip IA (hexágono central) -->
  <polygon points="64,22 84,33 84,55 64,66 44,55 44,33"
           fill="none" stroke="#00e5c0" stroke-width="2" opacity="0.9"/>

  <!-- Nodo central -->
  <circle cx="64" cy="44" r="8" fill="#00e5c0" filter="url(#glow)" opacity="0.95"/>

  <!-- Líneas de conexión desde el hexágono -->
  <line x1="44" y1="33" x2="28" y2="24" stroke="#00e5c0" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="55" x2="28" y2="64" stroke="#00e5c0" stroke-width="1.5" opacity="0.6"/>
  <line x1="84" y1="33" x2="100" y2="24" stroke="#00e5c0" stroke-width="1.5" opacity="0.6"/>
  <line x1="84" y1="55" x2="100" y2="64" stroke="#00e5c0" stroke-width="1.5" opacity="0.6"/>
  <line x1="64" y1="66" x2="64" y2="80" stroke="#00e5c0" stroke-width="1.5" opacity="0.6"/>

  <!-- Nodos satélite -->
  <circle cx="28" cy="24" r="5" fill="#ffd700" opacity="0.9"/>
  <circle cx="28" cy="64" r="5" fill="#ffd700" opacity="0.9"/>
  <circle cx="100" cy="24" r="5" fill="#ffd700" opacity="0.9"/>
  <circle cx="100" cy="64" r="5" fill="#ffd700" opacity="0.9"/>
  <circle cx="64" cy="80" r="5" fill="#ffd700" opacity="0.9"/>

  <!-- Flecha tendencia alcista (abajo) -->
  <polyline points="20,108 40,96 60,90 88,82 108,72"
            fill="none" stroke="#ffd700" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="108,72 100,70 104,79" fill="#ffd700"/>

  <!-- Texto "AI" pequeño dentro del hexágono -->
  <text x="64" y="49" text-anchor="middle" font-family="monospace"
        font-size="10" font-weight="bold" fill="#0a0d14">AI</text>
</svg>
