name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install TA-Lib C library
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends wget gcc make
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make -j$(nproc) && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p data/cache models reports logs

      - name: Create test .env
        run: |
          cp .env.example .env
          echo "EXCHANGE_API_KEY=test" >> .env
          echo "EXCHANGE_API_SECRET=test" >> .env

      - name: Run tests (fast — no slow/integration/ml)
        run: pytest tests/ -q --tb=short -m "not slow and not integration and not ml" --timeout=60

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: |
          flake8 strategies/ risk/ bot/ utils/ data/ \
            --max-line-length=100 \
            --ignore=E501,W503,E302,E303,W291,W293 \
            --exclude=__pycache__

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t trading-bot:latest .
