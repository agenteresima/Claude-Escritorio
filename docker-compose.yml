version: "3.9"

services:

  # ── Live trader (paper mode by default) ──────────────────────────────────────
  trader:
    build: .
    container_name: trading_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py live --dry-run

  # ── REST API ──────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: trading_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: uvicorn bot.api:app --host 0.0.0.0 --port 8000 --workers 1
    depends_on:
      - trader

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: trading_dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: python reports/dashboard.py

  # ── Webhook receiver (TradingView alerts) ────────────────────────────────────
  webhook:
    build: .
    container_name: trading_webhook
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    command: uvicorn bot.webhook:app --host 0.0.0.0 --port 8001
    depends_on:
      - trader

  # ── Telegram bot ──────────────────────────────────────────────────────────────
  telegram:
    build: .
    container_name: trading_telegram
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python bot/telegram_bot.py
    depends_on:
      - trader
