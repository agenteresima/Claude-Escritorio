version: "3.9"

services:

  # ── Live trader (paper mode by default) ──────────────────────────────────────
  trader:
    build: .
    container_name: trading_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py live --dry-run
    healthcheck:
      test: ["CMD", "python", "-c", "from data.database import get_conn; get_conn()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── REST API ──────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: trading_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: uvicorn bot.api:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      trader:
        condition: service_healthy

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: trading_dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: python reports/dashboard.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Webhook receiver (TradingView alerts) ────────────────────────────────────
  webhook:
    build: .
    container_name: trading_webhook
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    command: uvicorn bot.webhook:app --host 0.0.0.0 --port 8001
    depends_on:
      - trader

  # ── Telegram bot ──────────────────────────────────────────────────────────────
  telegram:
    build: .
    container_name: trading_telegram
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python bot/telegram_bot.py
    depends_on:
      - trader

  # ── Nginx reverse proxy (optional — for production with HTTPS) ────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: trading_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl:/etc/ssl:ro
    depends_on:
      - api
      - dashboard
      - webhook
    profiles:
      - production   # only starts with: docker-compose --profile production up
