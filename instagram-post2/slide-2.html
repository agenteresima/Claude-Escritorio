<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide 2 – Automatización Procesos IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, #060D1A 0%, #0A1628 50%, #070E1C 100%);
    position: relative;
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.5); font-size: 18px; font-weight: 600; z-index: 10;
  }
  /* Floating decorative numbers */
  .deco-num {
    position: absolute; font-weight: 900; color: rgba(37,99,235,0.07);
    user-select: none; pointer-events: none; z-index: 0;
  }
  .stat-section {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; padding: 60px 80px;
  }
  .big-stat {
    font-size: 220px; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #60A5FA 0%, #A855F7 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 60px rgba(96,165,250,0.5));
    margin: 0;
  }
  .stat-desc {
    font-size: 32px; font-weight: 700; color: #fff;
    text-align: center; max-width: 800px; line-height: 1.4;
    margin: 12px 0 0 0;
  }
  .source {
    margin-top: 14px;
    font-size: 14px; color: rgba(255,255,255,0.35); letter-spacing: 0.5px;
  }
  .divider {
    width: 500px; height: 2px; margin: 36px auto;
    background: linear-gradient(90deg, transparent, #3B82F6, #A855F7, transparent);
    border: none;
  }
  .highlight-box {
    background: rgba(37,99,235,0.08);
    border: 1px solid rgba(96,165,250,0.2);
    border-radius: 16px;
    padding: 22px 48px;
    font-size: 24px; font-weight: 600; font-style: italic;
    color: rgba(255,255,255,0.9);
    text-align: center;
    max-width: 780px;
    backdrop-filter: blur(4px);
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4); z-index: 20;
  }
</style>
</head>
<body>
  <!-- Decorative floating numbers -->
  <div class="deco-num" style="font-size:320px;top:-60px;left:-40px;opacity:1;">67</div>
  <div class="deco-num" style="font-size:200px;top:200px;right:-20px;opacity:1;color:rgba(168,85,247,0.06);">83</div>
  <div class="deco-num" style="font-size:260px;bottom:-40px;left:200px;opacity:1;color:rgba(6,182,212,0.05);">91</div>

  <div class="counter">2 / 7</div>

  <div class="stat-section">
    <p class="big-stat">67%</p>
    <p class="stat-desc">de tus competidores ya automatizan<br>procesos con IA</p>
    <p class="source">Informe IA Empresas España · 2026</p>
    <hr class="divider">
    <div class="highlight-box">
      "Cada mes que esperas, ellos se alejan más."
    </div>
  </div>

  <div style="position:absolute;bottom:36px;left:48px;display:flex;align-items:center;gap:10px;z-index:10;">
    <svg width="44" height="26" viewBox="0 0 44 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#A855F7"/></linearGradient></defs>
      <path d="M14 13C14 9.13 17.13 6 21 6C24.87 6 27.5 8.5 29 11C30.5 8.5 33.13 6 37 6C40.87 6 44 9.13 44 13C44 16.87 40.87 20 37 20C33.13 20 30.5 17.5 29 15C27.5 17.5 24.87 20 21 20C17.13 20 14 16.87 14 13Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
      <circle cx="21" cy="6" r="2" fill="#3B82F6"/><circle cx="37" cy="6" r="2" fill="#A855F7"/>
      <circle cx="21" cy="20" r="2" fill="#60A5FA"/><circle cx="37" cy="20" r="2" fill="#C084FC"/>
      <circle cx="29" cy="13" r="2.5" fill="url(#logoGrad)"/>
    </svg>
    <span style="color:rgba(255,255,255,0.85);font-size:11px;font-weight:600;letter-spacing:0.3px;line-height:1.3;">Automatización<br>Procesos IA</span>
  </div>
  <div class="bottom-bar"></div>
</body>
</html>
