<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 1 – Automatización Procesos IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    background: #060D1A;
    position: relative;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(37,99,235,0.07) 0px, rgba(37,99,235,0.07) 1px, transparent 1px, transparent 60px),
      repeating-linear-gradient(90deg, rgba(37,99,235,0.07) 0px, rgba(37,99,235,0.07) 1px, transparent 1px, transparent 60px);
    z-index: 0;
  }
  .orb {
    position: absolute;
    top: -200px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 700px;
    background: radial-gradient(ellipse at center, rgba(96,165,250,0.22) 0%, rgba(168,85,247,0.14) 45%, transparent 70%);
    z-index: 1; pointer-events: none;
  }
  .orb2 {
    position: absolute;
    top: 200px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse at center, rgba(37,99,235,0.18) 0%, transparent 70%);
    z-index: 1; pointer-events: none;
  }
  .badge {
    position: absolute; top: 80px; left: 48px;
    background: linear-gradient(135deg, #D97706, #F59E0B);
    color: #fff;
    padding: 8px 18px; border-radius: 50px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(245,158,11,0.35);
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.5); font-size: 18px; font-weight: 600;
    z-index: 10;
  }
  .hero {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; padding: 0 80px;
    margin-top: -40px;
  }
  .hero-line1 {
    font-size: 96px; font-weight: 900;
    color: #fff; line-height: 1; margin: 0;
    text-align: center;
    text-shadow: 0 0 60px rgba(96,165,250,0.3);
  }
  .hero-line2 {
    font-size: 96px; font-weight: 900;
    line-height: 1; margin: 0;
    text-align: center;
    background: linear-gradient(90deg, #60A5FA, #A855F7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(96,165,250,0.4));
  }
  .hero-line3 {
    font-size: 80px; font-weight: 800;
    color: #fff; line-height: 1; margin: 12px 0 0 0;
    text-align: center;
    text-shadow: 0 0 40px rgba(168,85,247,0.3);
  }
  .hero-sub {
    margin-top: 32px;
    font-size: 22px; font-weight: 400;
    color: rgba(255,255,255,0.68);
    text-align: center; max-width: 700px; line-height: 1.6;
  }
  .bottom-pill {
    position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%);
    border: 1.5px solid rgba(96,165,250,0.5);
    background: rgba(37,99,235,0.12);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,0.85);
    padding: 14px 36px; border-radius: 50px;
    font-size: 18px; font-weight: 600; letter-spacing: 0.2px;
    z-index: 10; white-space: nowrap;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4);
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb"></div>
  <div class="orb2"></div>
  <div class="counter">1 / 7</div>
  <div class="badge">🚨 Alerta para pymes · 2026</div>
  <div class="hero">
    <p class="hero-line1">Tu competencia</p>
    <p class="hero-line2">ya usa IA.</p>
    <p class="hero-line3">¿Y tú?</p>
    <p class="hero-sub">Mientras tu rival automatiza, tú pierdes clientes, tiempo y dinero.</p>
  </div>
  <div class="bottom-pill">👉 Desliza para ver la realidad</div>
  <div style="position:absolute;bottom:36px;left:48px;display:flex;align-items:center;gap:10px;z-index:10;">
    <svg width="44" height="26" viewBox="0 0 44 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#3B82F6"/>
          <stop offset="100%" stop-color="#A855F7"/>
        </linearGradient>
      </defs>
      <path d="M14 13C14 9.13 17.13 6 21 6C24.87 6 27.5 8.5 29 11C30.5 8.5 33.13 6 37 6C40.87 6 44 9.13 44 13C44 16.87 40.87 20 37 20C33.13 20 30.5 17.5 29 15C27.5 17.5 24.87 20 21 20C17.13 20 14 16.87 14 13Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
      <circle cx="21" cy="6" r="2" fill="#3B82F6"/>
      <circle cx="37" cy="6" r="2" fill="#A855F7"/>
      <circle cx="21" cy="20" r="2" fill="#60A5FA"/>
      <circle cx="37" cy="20" r="2" fill="#C084FC"/>
      <circle cx="29" cy="13" r="2.5" fill="url(#logoGrad)"/>
    </svg>
    <span style="color:rgba(255,255,255,0.85);font-size:11px;font-weight:600;letter-spacing:0.3px;line-height:1.3;">Automatización<br>Procesos IA</span>
  </div>
  <div class="bottom-bar"></div>
</body>
</html>
