<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #060D1A;
    position: relative;
  }
  /* Center blue glow */
  .glow {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 700px; height: 700px;
    background: radial-gradient(ellipse at center, rgba(37,99,235,0.18) 0%, rgba(168,85,247,0.08) 40%, transparent 70%);
    border-radius: 50%;
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.5); font-size: 18px; font-weight: 600;
  }
  .title {
    position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
    color: white; font-size: 52px; font-weight: 800;
    white-space: nowrap; text-align: center;
  }
  /* Big metric */
  .metric {
    position: absolute; top: 185px; left: 50%; transform: translateX(-50%);
    text-align: center; width: 950px;
  }
  .metric-text {
    font-size: 56px; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(90deg, #60A5FA, #A855F7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; white-space: nowrap;
  }
  .metric-sub {
    color: rgba(148,163,184,0.8); font-size: 22px; font-weight: 500; margin-top: 10px;
  }
  /* Quote card */
  .quote-card {
    position: absolute; top: 390px; left: 64px; right: 64px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(96,165,250,0.2);
    border-left: 5px solid transparent;
    border-image: linear-gradient(180deg, #3B82F6, #A855F7) 1;
    border-radius: 16px;
    padding: 36px 40px;
  }
  .quote-text {
    color: white; font-size: 24px; font-style: italic; line-height: 1.5; font-weight: 500;
  }
  .quote-text::before { content: '"'; font-size: 40px; color: #60A5FA; line-height: 0; vertical-align: -14px; margin-right: 4px; }
  .quote-text::after { content: '"'; font-size: 40px; color: #A855F7; line-height: 0; vertical-align: -14px; margin-left: 4px; }
  .attribution {
    color: rgba(148,163,184,0.6); font-size: 18px; font-weight: 500;
    margin-top: 20px;
  }
  /* Stars */
  .stars {
    position: absolute; top: 360px; left: 64px;
    font-size: 28px; letter-spacing: 4px;
  }
  /* Verified badge */
  .verified {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3);
    border-radius: 999px; padding: 6px 16px;
    color: #60A5FA; font-size: 15px; font-weight: 600;
    margin-top: 14px;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4);
  }
  .logo { position: absolute; bottom: 36px; left: 48px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="counter">6/7</div>
<div class="title">Resultado real de un cliente</div>
<div class="metric">
  <div class="metric-text">De 8 horas → 45 minutos</div>
  <div class="metric-sub">Gestión de pedidos y facturación automatizada</div>
</div>
<div class="stars">⭐⭐⭐⭐⭐</div>
<div class="quote-card">
  <div class="quote-text">Ahorramos 35 horas semanales. El sistema trabaja solo mientras nosotros atendemos a los clientes.</div>
  <div class="attribution">— Empresa distribución · Valencia</div>
  <div><span class="verified">✓ Caso verificado · 2025</span></div>
</div>
<div class="logo">
<svg width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
  </defs>
  <path d="M8,20 C8,14 13,10 18,10 C23,10 26,14 28,17 C26,20 23,24 18,24 C13,24 8,26 8,20 Z M28,17 C30,14 33,10 38,10 C43,10 48,14 48,20 C48,26 43,30 38,30 C33,30 30,26 28,23 C26,20 28,17 28,17 Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="8" cy="20" r="2.5" fill="#3B82F6"/>
  <circle cx="48" cy="20" r="2.5" fill="#A855F7"/>
  <circle cx="28" cy="17" r="2" fill="url(#logoGrad)"/>
  <circle cx="18" cy="10" r="1.5" fill="#3B82F6"/>
  <circle cx="38" cy="30" r="1.5" fill="#A855F7"/>
  <text x="56" y="16" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="white">Automatización</text>
  <text x="56" y="27" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="white">Procesos IA</text>
</svg>
</div>
<div class="bottom-bar"></div>
</body>
</html>
