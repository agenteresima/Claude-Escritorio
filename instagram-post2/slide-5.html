<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide 5 – Automatización Procesos IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, #060D1A 0%, #0D1B35 100%);
    position: relative;
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.5); font-size: 18px; font-weight: 600; z-index: 10;
  }
  .content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 70px 72px 110px;
    z-index: 5;
  }
  .title {
    font-size: 62px; font-weight: 800; color: #fff;
    text-align: center; margin: 0 0 44px 0; line-height: 1.1;
  }
  .step-card {
    width: 100%;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 28px 36px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 32px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 1px transparent, inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .step-card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 20px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(59,130,246,0.4), rgba(168,85,247,0.4));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  .step-num {
    font-size: 72px; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #60A5FA, #A855F7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; flex-shrink: 0; width: 120px;
  }
  .step-text { flex: 1; }
  .step-title {
    font-size: 26px; font-weight: 700; color: #fff; margin: 0 0 6px 0;
  }
  .step-sub {
    font-size: 18px; font-weight: 400; color: rgba(255,255,255,0.5); margin: 0;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4); z-index: 20;
  }
</style>
</head>
<body>
  <div class="counter">5 / 7</div>

  <div class="content">
    <h1 class="title">Así de fácil es empezar</h1>

    <div class="step-card">
      <div class="step-num">01</div>
      <div class="step-text">
        <p class="step-title">Diagnóstico gratuito de tu empresa</p>
        <p class="step-sub">30 minutos · Sin compromiso</p>
      </div>
    </div>

    <div class="step-card">
      <div class="step-num">02</div>
      <div class="step-text">
        <p class="step-title">Plan de automatización personalizado</p>
        <p class="step-sub">Sin código · Adaptado a tu negocio</p>
      </div>
    </div>

    <div class="step-card">
      <div class="step-num">03</div>
      <div class="step-text">
        <p class="step-title">Implementación en menos de 30 días</p>
        <p class="step-sub">Empiezas a ahorrar tiempo desde el día 1</p>
      </div>
    </div>
  </div>

  <div style="position:absolute;bottom:36px;left:48px;display:flex;align-items:center;gap:10px;z-index:10;">
    <svg width="44" height="26" viewBox="0 0 44 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#A855F7"/></linearGradient></defs>
      <path d="M14 13C14 9.13 17.13 6 21 6C24.87 6 27.5 8.5 29 11C30.5 8.5 33.13 6 37 6C40.87 6 44 9.13 44 13C44 16.87 40.87 20 37 20C33.13 20 30.5 17.5 29 15C27.5 17.5 24.87 20 21 20C17.13 20 14 16.87 14 13Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
      <circle cx="21" cy="6" r="2" fill="#3B82F6"/><circle cx="37" cy="6" r="2" fill="#A855F7"/>
      <circle cx="21" cy="20" r="2" fill="#60A5FA"/><circle cx="37" cy="20" r="2" fill="#C084FC"/>
      <circle cx="29" cy="13" r="2.5" fill="url(#logoGrad)"/>
    </svg>
    <span style="color:rgba(255,255,255,0.85);font-size:11px;font-weight:600;letter-spacing:0.3px;line-height:1.3;">Automatización<br>Procesos IA</span>
  </div>
  <div class="bottom-bar"></div>
</body>
</html>
