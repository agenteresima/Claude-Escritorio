<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, #060D1A 0%, #0D1B35 100%);
    position: relative;
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.5); font-size: 18px; font-weight: 600;
  }
  .title {
    position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
    color: white; font-size: 60px; font-weight: 800; line-height: 1.1;
    white-space: nowrap; text-align: center;
  }
  /* Cards container */
  .cards {
    position: absolute;
    top: 195px; left: 64px; right: 64px;
    display: flex; flex-direction: column; gap: 0;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(96,165,250,0.15);
    border-left: 4px solid transparent;
    border-radius: 16px;
    padding: 28px 32px;
    display: flex; align-items: center; gap: 28px;
    margin-bottom: 16px;
    position: relative;
  }
  .card-1 { border-left: 4px solid #3B82F6; }
  .card-2 { border-left: 4px solid #8B5CF6; }
  .card-3 { border-left: 4px solid #A855F7; }
  .card-num {
    font-size: 72px; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #60A5FA, #A855F7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; flex-shrink: 0; width: 100px;
  }
  .card-body { flex: 1; }
  .card-title { color: white; font-size: 26px; font-weight: 700; line-height: 1.2; }
  .card-sub { color: rgba(148,163,184,0.8); font-size: 18px; font-weight: 500; margin-top: 6px; }
  /* Connector dots */
  .connector {
    display: flex; justify-content: flex-start; padding-left: 96px;
    margin-bottom: 0; margin-top: -10px;
  }
  .dot-line {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    height: 16px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(96,165,250,0.3); }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4);
  }
  .logo { position: absolute; bottom: 36px; left: 48px; }
</style>
</head>
<body>
<div class="counter">5/7</div>
<div class="title">Así de fácil es empezar</div>
<div class="cards">
  <div class="card card-1">
    <div class="card-num">01</div>
    <div class="card-body">
      <div class="card-title">Diagnóstico gratuito de tu empresa</div>
      <div class="card-sub">(30 min) — Analizamos tus procesos actuales</div>
    </div>
  </div>
  <div class="card card-2">
    <div class="card-num">02</div>
    <div class="card-body">
      <div class="card-title">Plan de automatización personalizado</div>
      <div class="card-sub">(sin código) — Diseñamos la solución ideal para ti</div>
    </div>
  </div>
  <div class="card card-3">
    <div class="card-num">03</div>
    <div class="card-body">
      <div class="card-title">Implementación en menos de 30 días</div>
      <div class="card-sub">Tu empresa funcionando en piloto automático</div>
    </div>
  </div>
</div>
<div class="logo">
<svg width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
  </defs>
  <path d="M8,20 C8,14 13,10 18,10 C23,10 26,14 28,17 C26,20 23,24 18,24 C13,24 8,26 8,20 Z M28,17 C30,14 33,10 38,10 C43,10 48,14 48,20 C48,26 43,30 38,30 C33,30 30,26 28,23 C26,20 28,17 28,17 Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="8" cy="20" r="2.5" fill="#3B82F6"/>
  <circle cx="48" cy="20" r="2.5" fill="#A855F7"/>
  <circle cx="28" cy="17" r="2" fill="url(#logoGrad)"/>
  <circle cx="18" cy="10" r="1.5" fill="#3B82F6"/>
  <circle cx="38" cy="30" r="1.5" fill="#A855F7"/>
  <text x="56" y="16" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="white">Automatización</text>
  <text x="56" y="27" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="white">Procesos IA</text>
</svg>
</div>
<div class="bottom-bar"></div>
</body>
</html>
