<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide 7 – Automatización Procesos IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1D4ED8 0%, #4F46E5 40%, #7C3AED 100%);
    position: relative;
  }
  /* White dot pattern */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.12) 1.5px, transparent 1.5px);
    background-size: 36px 36px;
    pointer-events: none; z-index: 0;
  }
  /* Subtle inner glow */
  .inner-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.08) 0%, transparent 65%);
    pointer-events: none; z-index: 1;
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.6); font-size: 18px; font-weight: 600; z-index: 10;
  }
  .content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 5; padding: 60px 80px 80px;
  }
  .main-question {
    font-size: 50px; font-weight: 800; color: #fff;
    text-align: center; margin: 0 0 14px 0; line-height: 1.15;
    text-shadow: 0 2px 30px rgba(0,0,0,0.2);
  }
  .sub-text {
    font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.9);
    text-align: center; margin: 0 0 36px 0;
  }
  .cta-box {
    background: #fff; border-radius: 24px;
    padding: 30px 64px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 4px 16px rgba(0,0,0,0.15);
    width: 680px;
  }
  .cta-title {
    font-size: 34px; font-weight: 800; color: #1E3A8A; margin: 0 0 8px 0;
    letter-spacing: -0.5px;
  }
  .cta-url {
    font-size: 20px; font-weight: 600; color: #2563EB;
    text-decoration: none; letter-spacing: 0.2px;
  }
  .secondary-text {
    margin-top: 22px;
    font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.75);
    text-align: center; letter-spacing: 0.2px;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, rgba(255,255,255,0.3), rgba(255,255,255,0.7), rgba(255,255,255,0.3));
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="dots"></div>

    </div>

    <p class="secondary-text">Sin compromiso &nbsp;·&nbsp; Sin código &nbsp;·&nbsp; Resultados en 30 días</p>
  </div>

      <circle cx="21" cy="20" r="2" fill="rgba(255,255,255,0.9)"/><circle cx="37" cy="20" r="2" fill="rgba(255,255,255,0.7)"/>
      <circle cx="29" cy="13" r="2.5" fill="url(#logoGrad)"/>
