<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1D4ED8 0%, #4F46E5 40%, #7C3AED 100%);
    position: relative;
  }
  /* Dot pattern overlay */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  /* Extra glow overlay */
  .glow {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 800px; height: 800px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.06) 0%, transparent 60%);
    border-radius: 50%;
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.6); font-size: 18px; font-weight: 600;
  }
  /* Main content */
  .content {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -52%);
    text-align: center; width: 940px;
  }
  /* Decorative chevrons */
  .chevrons-top {
    font-size: 36px; color: rgba(255,255,255,0.25);
    margin-bottom: 16px; letter-spacing: 8px;
  }
  .main-q {
    color: white; font-size: 54px; font-weight: 900; line-height: 1.1;
    letter-spacing: -1px;
  }
  .sub-q {
    color: rgba(219,234,254,0.9); font-size: 28px; font-weight: 600;
    margin-top: 20px;
  }
  /* CTA box */
  .cta-box {
    margin-top: 40px;
    background: rgba(6,13,26,0.55);
    border-radius: 20px;
    padding: 36px 48px;
    display: inline-block;
    position: relative;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.2), 0 20px 60px rgba(0,0,0,0.3);
  }
  .cta-label {
    color: white; font-size: 36px; font-weight: 800; display: block;
  }
  .cta-url {
    font-size: 24px; font-weight: 700; margin-top: 10px; display: block;
    background: linear-gradient(90deg, #93C5FD, #C084FC);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .cta-fine {
    color: rgba(255,255,255,0.65); font-size: 18px; font-weight: 500;
    margin-top: 24px;
    letter-spacing: 0.3px;
  }
  .chevrons-bottom {
    font-size: 36px; color: rgba(255,255,255,0.25);
    margin-top: 24px; letter-spacing: 8px;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4);
  }
  .logo { position: absolute; bottom: 36px; left: 48px; }
</style>
</head>
<body>
<div class="dots"></div>
<div class="glow"></div>
<div class="counter">7/7</div>
<div class="content">
  <div class="chevrons-top">▼ ▼ ▼</div>
  <div class="main-q">¿Cuántas horas pierdes tú<br>cada semana?</div>
  <div class="sub-q">Descúbrelo gratis en 30 minutos.</div>
  <div>
    <div class="cta-box">
      <span class="cta-label">🎯 Diagnóstico Gratuito</span>
      <span class="cta-url">automatizacionprocesos.es</span>
    </div>
  </div>
  <div class="cta-fine">Sin compromiso · Sin código · Resultados en 30 días</div>
  <div class="chevrons-bottom">▲ ▲ ▲</div>
</div>
<div class="logo">
<svg width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
  </defs>
  <path d="M8,20 C8,14 13,10 18,10 C23,10 26,14 28,17 C26,20 23,24 18,24 C13,24 8,26 8,20 Z M28,17 C30,14 33,10 38,10 C43,10 48,14 48,20 C48,26 43,30 38,30 C33,30 30,26 28,23 C26,20 28,17 28,17 Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="8" cy="20" r="2.5" fill="#3B82F6"/>
  <circle cx="48" cy="20" r="2.5" fill="#A855F7"/>
  <circle cx="28" cy="17" r="2" fill="url(#logoGrad)"/>
  <circle cx="18" cy="10" r="1.5" fill="#3B82F6"/>
  <circle cx="38" cy="30" r="1.5" fill="#A855F7"/>
  <text x="56" y="16" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="white">Automatización</text>
  <text x="56" y="27" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="white">Procesos IA</text>
</svg>
</div>
<div class="bottom-bar"></div>
</body>
</html>
