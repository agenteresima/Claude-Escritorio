<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide 3 – Automatización Procesos IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    background: #030810;
    position: relative;
  }
  /* Red/orange glow bottom-left */
  .glow-bl {
    position: absolute; bottom: -150px; left: -150px;
    width: 600px; height: 600px;
    background: radial-gradient(ellipse at center, rgba(239,68,68,0.12) 0%, rgba(234,88,12,0.07) 40%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .counter {
    position: absolute; top: 40px; right: 48px;
    color: rgba(255,255,255,0.5); font-size: 18px; font-weight: 600; z-index: 10;
  }
  .content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 48px 64px 80px;
    z-index: 5;
  }
  .title {
    font-size: 50px; font-weight: 800; color: #fff;
    margin: 0 0 24px 0; line-height: 1.1;
  }
  .item {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.04);
    border-left: 3px solid rgba(239,68,68,0.5);
    border-radius: 0 12px 12px 0;
    padding: 14px 24px;
    margin-bottom: 10px;
    font-size: 21px; font-weight: 600; color: rgba(255,255,255,0.88);
    gap: 16px;
  }
  .item-icon { font-size: 20px; flex-shrink: 0; }
  .highlight-amber {
    background: linear-gradient(135deg, rgba(217,119,6,0.22), rgba(245,158,11,0.15));
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 14px;
    padding: 16px 28px;
    margin-top: 16px;
    font-size: 18px; font-weight: 700; color: #FCD34D;
    line-height: 1.5; text-align: center;
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4); z-index: 20;
  }
</style>
</head>
<body>
  <div class="glow-bl"></div>
  <div class="counter">3 / 7</div>

  <div class="content">
    <h1 class="title">Tú sigues haciendo esto a mano 👇</h1>

    <div class="item"><span class="item-icon">❌</span> Responder emails uno a uno</div>
    <div class="item"><span class="item-icon">❌</span> Hacer informes en Excel cada semana</div>
    <div class="item"><span class="item-icon">❌</span> Copiar datos entre sistemas</div>
    <div class="item"><span class="item-icon">❌</span> Atender las mismas preguntas repetidas</div>
    <div class="item"><span class="item-icon">❌</span> Enviar facturas manualmente</div>

    <div class="highlight-amber">
      Eso son <strong>3 horas al día</strong>. <strong>15 horas a la semana</strong>. <strong>720 horas al año.</strong>
    </div>
  </div>

  <div style="position:absolute;bottom:36px;left:48px;display:flex;align-items:center;gap:10px;z-index:10;">
    <svg width="44" height="26" viewBox="0 0 44 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#A855F7"/></linearGradient></defs>
      <path d="M14 13C14 9.13 17.13 6 21 6C24.87 6 27.5 8.5 29 11C30.5 8.5 33.13 6 37 6C40.87 6 44 9.13 44 13C44 16.87 40.87 20 37 20C33.13 20 30.5 17.5 29 15C27.5 17.5 24.87 20 21 20C17.13 20 14 16.87 14 13Z" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
      <circle cx="21" cy="6" r="2" fill="#3B82F6"/><circle cx="37" cy="6" r="2" fill="#A855F7"/>
      <circle cx="21" cy="20" r="2" fill="#60A5FA"/><circle cx="37" cy="20" r="2" fill="#C084FC"/>
      <circle cx="29" cy="13" r="2.5" fill="url(#logoGrad)"/>
    </svg>
    <span style="color:rgba(255,255,255,0.85);font-size:11px;font-weight:600;letter-spacing:0.3px;line-height:1.3;">Automatización<br>Procesos IA</span>
  </div>
  <div class="bottom-bar"></div>
</body>
</html>
