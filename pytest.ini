[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -q
markers =
    slow: marks tests that are slow (use -m "not slow" to skip)
    integration: marks tests requiring live API access
    ml: marks tests requiring trained ML model
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore::UserWarning
