# ============================================================
# Professional Trading Bot — Full Configuration
# Override any value with environment variables or .env.
# For local customisation: copy to config.local.yaml
# ============================================================

exchange:
  name: binance                  # binance | bybit | okx | kraken | kucoin
  sandbox: true                  # ALWAYS start with sandbox=true

risk:
  max_open_trades: 5
  stake_amount_pct: 0.02         # 2% of capital per trade
  max_drawdown_pct: 0.15         # pause trading if DD > 15%
  risk_reward_ratio: 2.0         # minimum 1:2 R/R required
  trailing_stop_pct: 0.03        # 3% trailing stop
  hard_stop_pct: 0.05            # 5% hard stop-loss
  take_profit_pct: 0.06          # 6% take-profit baseline
  max_position_size_pct: 0.10    # never > 10% of capital in one asset
  kelly_fraction: 0.25           # fractional Kelly cap (0 = disabled)
  atr_multiplier_stop: 1.5       # ATR-based stop multiplier
  atr_multiplier_tp: 3.0         # ATR-based TP multiplier

portfolio_heat:
  max_heat_pct: 0.06             # max 6% total capital at risk across all positions
  enabled: true

backtest:
  start_date: "2021-01-01"
  end_date:   "2024-12-31"
  initial_capital: 10000.0
  commission: 0.001              # 0.1% maker/taker
  slippage: 0.0005               # 0.05% market impact
  use_trailing_stop: true

trading:
  pairs:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
    - SOL/USDT
    - ADA/USDT
  timeframe: 1h
  higher_timeframe: 4h
  dry_run: true
  active_strategy: regime_adaptive

# ── Entry filters ─────────────────────────────────────────
filters:
  correlation_threshold: 0.80    # block new positions correlated > 80% with open
  sentiment_enabled: true        # Fear & Greed gate (blocks longs at extreme greed)
  events_filter_enabled: true    # macro news blackout (1h before, 2h after)
  orderbook_filter_enabled: true # require 60%+ bid imbalance for longs
  candle_pattern_confirm: true   # require confirming candle pattern
  min_volume_ratio: 1.0          # candle volume >= N × 20-bar average

# ── Machine learning ─────────────────────────────────────
ml:
  model_dir: models/
  retrain_every_n_weeks: 4       # auto-retrain if model older than this
  min_confidence: 0.55           # XGBoost prediction probability threshold
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.05

# ── Notifications ─────────────────────────────────────────
notifications:
  telegram_enabled: false        # set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env
  notify_on_open: true
  notify_on_close: true
  notify_on_drawdown_pct: 0.08   # alert if DD > 8%
  weekly_report_enabled: true    # send HTML report every Monday 09:00 UTC

# ── REST API ─────────────────────────────────────────────
api:
  enabled: true
  host: 0.0.0.0
  port: 8000

# ── Dashboard ────────────────────────────────────────────
dashboard:
  enabled: true
  port: 8050
  refresh_interval_s: 30         # auto-refresh interval

# ── TradingView webhook ──────────────────────────────────
webhook:
  enabled: false
  port: 8001

# ── Auto-compound ────────────────────────────────────────
auto_compound:
  enabled: false
  mode: reinvest_half            # reinvest_all | reinvest_half | fixed_withdraw | percent_withdraw
  withdraw_amount: 0.0
  rebalance_threshold_pct: 0.10  # rebalance if allocation drifts > 10%

# ── Strategy health monitor ──────────────────────────────
strategy_monitor:
  enabled: true
  baseline_sharpe: 1.5
  baseline_win_rate: 55.0
  rolling_window_trades: 30
  alert_on_warning: true
  pause_on_critical: true

# ── Data ─────────────────────────────────────────────────
data:
  cache_dir: data/cache
  cache_ttl_hours: 24
  backup_dir: data/backups
  keep_backups: 30

# ── Logging ──────────────────────────────────────────────
logging:
  level: INFO
  log_file: logs/bot.log
  rotation: 10 MB
  retention: 30 days
