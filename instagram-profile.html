<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Instagram Profile — Automatización Procesos IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 20px;
    font-family: 'Inter', sans-serif;
  }
  p {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }

  /* ── IMAGEN DE PERFIL ── */
  .avatar {
    width: 500px;
    height: 500px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    background: #060D1A;
    flex-shrink: 0;
  }

  /* Fondo con gradientes */
  .av-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at 50% 10%, rgba(37,99,235,0.55) 0%, transparent 65%),
      radial-gradient(ellipse 60% 50% at 85% 85%, rgba(99,102,241,0.3) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 10% 85%, rgba(6,182,212,0.15) 0%, transparent 55%),
      #060D1A;
  }

  /* Grid de puntos */
  .av-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(37,99,235,0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,0.1) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  /* Anillos decorativos */
  .av-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(96,165,250,0.2);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .av-ring-1 { width: 320px; height: 320px; border-color: rgba(96,165,250,0.25); }
  .av-ring-2 { width: 400px; height: 400px; border-color: rgba(96,165,250,0.12); }

  /* Orbe central */
  .av-orb {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -58%);
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3B82F6 0%, #1D4ED8 45%, #0F172A 100%);
    box-shadow:
      0 0 60px rgba(37,99,235,0.7),
      0 0 120px rgba(37,99,235,0.3),
      inset 0 0 40px rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }
  .av-orb::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,0.18), transparent 55%);
  }

  /* Texto inferior */
  .av-text {
    position: absolute;
    bottom: 80px; left: 0; right: 0;
    text-align: center;
  }
  .av-name {
    font-size: 28px; font-weight: 900;
    color: #FFFFFF;
    letter-spacing: -0.5px;
    line-height: 1.15;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }
  .av-name span { color: #60A5FA; }
  .av-sub {
    font-size: 14px; font-weight: 600;
    color: rgba(255,255,255,0.45);
    margin-top: 6px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* Barra inferior de color */
  .av-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #1D4ED8, #60A5FA, #06B6D4);
  }

  /* Puntos de luz decorativos */
  .av-dot {
    position: absolute;
    border-radius: 50%;
    background: #60A5FA;
    box-shadow: 0 0 10px #2563EB;
  }
</style>
</head>
<body>

  <div class="avatar" id="avatar">
    <div class="av-bg"></div>
    <div class="av-grid"></div>
    <div class="av-ring av-ring-2"></div>
    <div class="av-ring av-ring-1"></div>

    <!-- Puntos decorativos -->
    <div class="av-dot" style="width:6px;height:6px;top:18%;left:22%;opacity:0.8;"></div>
    <div class="av-dot" style="width:4px;height:4px;top:25%;right:24%;opacity:0.6;"></div>
    <div class="av-dot" style="width:5px;height:5px;top:55%;left:16%;opacity:0.5;"></div>
    <div class="av-dot" style="width:4px;height:4px;top:60%;right:17%;opacity:0.5;"></div>

    <div class="av-orb">🤖</div>

    <div class="av-text">
      <div class="av-name">Automatización<br><span>Procesos IA</span></div>
      <div class="av-sub">Valencia · España</div>
    </div>

    <div class="av-bar"></div>
  </div>

  <p>Captura el círculo · 500 × 500 px · Instagram recorta en círculo automáticamente</p>

</body>
</html>
